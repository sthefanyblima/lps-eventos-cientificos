# Gerado automaticamente pela LPS — produto: SBES 2026 — Simpósio Brasileiro de Engenharia de Software
services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_USER: lps
      MYSQL_PASSWORD: lps123
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    ports: ["3306:3306"]
    volumes: ["./mysql-init.sql:/docker-entrypoint-initdb.d/init.sql", "mysql-data:/var/lib/mysql"]
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-proot"]
      interval: 5s
      retries: 20
  registry:
    build: ..
    command: uvicorn services.registry.main:app --host 0.0.0.0 --port 8761
    environment:
      PRODUCT_CONFIG: /app/products/sbes-2026.json
      SERVICE_HOST_MODE: docker
      DATABASE_URL: mysql+pymysql://lps:lps123@mysql:3306/{db}
      REGISTRY_URL: http://registry:8761
    ports: ["8761:8761"]
  users:
    build: ..
    command: uvicorn services.users.main:app --host 0.0.0.0 --port 8001
    environment:
      PRODUCT_CONFIG: /app/products/sbes-2026.json
      SERVICE_HOST_MODE: docker
      DATABASE_URL: mysql+pymysql://lps:lps123@mysql:3306/{db}
      REGISTRY_URL: http://registry:8761
    ports: ["8001:8001"]
    depends_on:
      mysql:
        condition: service_healthy
      registry:
        condition: service_started
  events:
    build: ..
    command: uvicorn services.events.main:app --host 0.0.0.0 --port 8002
